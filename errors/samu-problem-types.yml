note: >-
  NOT RFC 9457. The REST API returns a flat JSON envelope
  {"status":"error","message":"..."} declared as the ErrorResponse schema; there
  is no type URI, no title/detail split and no application/problem+json media
  type. The MCP endpoint uses a DIFFERENT and richer envelope observed live:
  {"success":false,"data":null,"error":{"code":"MCP_UNAUTHORIZED","message":"..."},"meta":{},"timestamp":"..."}.
  Samu publishes no error-code reference page, so no code registry could be
  captured — the only error code observed anywhere is MCP_UNAUTHORIZED, seen on a
  live 401 from the MCP endpoint.
