- name: Samu MCP Server
  description: >-
    Hosted, remote MCP server that connects Samu to Claude, ChatGPT and other AI
    agents, published as a Pro-plan feature. The endpoint answers MCP JSON-RPC
    over HTTP POST at https://api.samu.ai/mcp and is protected by OAuth 2.1 with
    dynamic client registration (RFC 7591), PKCE S256 and the mcp:read scope, as
    advertised by the RFC 8414 authorization-server metadata and the RFC 9728
    protected-resource metadata on the same host. tools/list is auth-gated, so the
    live tool schemas could not be enumerated anonymously.
  humanURL: https://samu.ai/precios
  baseURL: https://api.samu.ai/mcp
