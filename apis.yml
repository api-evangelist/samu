name: Samu
description: >-
  Samu (samu.ai) is an AI-powered conversation-intelligence and sales-analytics
  platform built for sales managers and revenue leaders across Latin America. It
  automatically records and transcribes customer interactions across WhatsApp,
  phone calls, video calls, Microsoft Teams, and Google Meet, then analyzes them
  to surface actionable coaching insights. Features include an AI "Samu Score"
  that evaluates call quality against customizable criteria, custom data
  extractors (e.g. competitor mentions or company size), analysis using SPICED,
  BANT, and SANDLER sales frameworks, and auto-generated CRM notes, tasks, and
  meeting summaries. Samu integrates bidirectionally with HubSpot, Pipedrive,
  Salesforce, and other CRMs, and emphasizes high-accuracy Spanish-language
  transcription. Samu publishes a REST API (OpenAPI 3.0.0, "API Samu") at
  api.samu.ai covering users, meetings, transcriptions and WhatsApp/chat threads,
  authenticated with an account apiKey header, plus an OAuth-protected hosted MCP
  server at api.samu.ai/mcp that connects Samu to Claude, ChatGPT and other AI
  agents. API access is sold on the Enterprise plan and MCP on the Pro plan.
  Samu is backed by 500 Global.
