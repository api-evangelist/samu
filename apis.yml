apis:
- name: API Samu
  description: >-
    REST API for the Samu conversation-intelligence platform. Covers account
    users, meeting creation and update from externally recorded calls (audio/video
    URL plus optional transcription), meeting retrieval and transcription
    retrieval, date-ranged meeting listing with offset pagination, and the chat
    surface for WhatsApp/HubSpot/email conversation threads, their messages and
    their daily AI-generated interaction summaries. Authenticated with an account
    API key sent in the apiKey header. Sold as "API Out / API In" on the
    Enterprise plan.
  humanURL: https://api.samu.ai/docs
  baseURL: https://api.samu.ai
