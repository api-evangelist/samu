    server: https://api.samu.ai
    auth: apiKey header
    gated: false
  mcp:
    url: https://api.samu.ai/mcp
    auth: OAuth 2.1 (scope mcp:read)
    gated: true
    gate_evidence: 'POST tools/list -> HTTP 401 MCP_UNAUTHORIZED (2026-08-13)'
  graphql:
    present: false
    note: >-
      https://api.samu.ai/graphql returns 404. dashboard.samu.ai/graphql returns
      200 but that is the SPA catch-all HTML shell, not a GraphQL endpoint.
