note: >-
  Samu ships BOTH a REST API and a hosted MCP server on the same host
  (api.samu.ai), so the crosswalk is emitted. The MCP tool list is OAuth-gated
  (tools/list returns 401 MCP_UNAUTHORIZED) and Samu publishes no tool names in
  its docs, pricing page or llms.txt. crosswalk[] is therefore EMPTY by design:
  with zero observed tool names there is nothing to bind, and naming plausible
  tools would fabricate the server's contract. rest_only[] below is the complete,
  real REST surface, and is what an authenticated re-run should be diffed against.
