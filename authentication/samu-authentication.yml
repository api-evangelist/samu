source: openapi/samu-openapi.yml
docs: https://api.samu.ai/docs
note: >-
  Two distinct auth models on one host. The REST API (api.samu.ai/api/*) uses a
  static account API key in a header literally named "apiKey" (not Authorization,
  not X-API-Key) — worth noting because it is unusual and easy to get wrong. The
  MCP endpoint (api.samu.ai/mcp) uses OAuth 2.1 bearer tokens with dynamic client
  registration and PKCE, advertised via RFC 8414 metadata; it rejects anonymous
  calls with 401 MCP_UNAUTHORIZED and a WWW-Authenticate challenge pointing at
  its RFC 9728 protected-resource metadata. Samu publishes no page describing how
  to obtain an API key; the pricing page places API access on the Enterprise plan
  and MCP on the Pro plan, so provisioning is sales-mediated.
